<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
        .container { max-width: 800px; width: 100%; }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; color: #f8fafc; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.4rem; color: #94a3b8; }
        input, select { width: 100%; padding: 0.6rem 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.9rem; }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        button { width: 100%; padding: 0.75rem; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #4f46e5; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .result { text-align: center; }
        .result img { max-width: 100%; border-radius: 12px; margin-top: 1rem; }
        .error { background: #7f1d1d; color: #fecaca; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .spinner { display: none; margin: 1rem auto; width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Generator</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form class="card" method="post" onsubmit="document.querySelector('.spinner').style.display='block'; this.querySelector('button').disabled=true;">
            <div class="form-grid">
                <div class="full">
                    <label for="prompt">Prompt</label>
                    <input type="text" id="prompt" name="prompt" placeholder="e.g. Lotus with wisteria..." value="{{ request.form.get('prompt', '') }}" required>
                </div>
                <div class="full">
                    <label for="negative_prompt">Negative Prompt</label>
                    <input type="text" id="negative_prompt" name="negative_prompt" placeholder="e.g. blurry, low quality" value="{{ request.form.get('negative_prompt', '') }}">
                </div>
                <div>
                    <label for="model">Model</label>
                    <select id="model" name="model">
                        <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL 1.0</option>
                        <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>
                        <option value="runwayml/stable-diffusion-v1-5">SD 1.5</option>
                    </select>
                </div>
                <div>
                    <label for="steps">Steps</label>
                    <input type="number" id="steps" name="steps" value="25" min="1" max="100">
                </div>
                <div>
                    <label for="guidance_scale">Guidance Scale</label>
                    <input type="number" id="guidance_scale" name="guidance_scale" value="7.5" min="1" max="20" step="0.5">
                </div>
                <div>
                    <label for="width">Width</label>
                    <input type="number" id="width" name="width" value="1024" min="256" max="2048" step="64">
                </div>
                <div>
                    <label for="height">Height</label>
                    <input type="number" id="height" name="height" value="1024" min="256" max="2048" step="64">
                </div>
            </div>
            <button type="submit">Generate</button>
            <div class="spinner"></div>
        </form>

        {% if image_path %}
        <div class="card result">
            <h3>Generated Image</h3>
            <img src="{{ url_for('static', filename=image_path) }}" alt="Generated image">
        </div>
        {% endif %}
    </div>
</body>
</html>
